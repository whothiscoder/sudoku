<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku Surprise</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="container header">
    <div>
      <h1>Sudoku Surprise</h1>
      <p class="sub">Solve both puzzles to reveal the messages 💛</p>
    </div>
  </header>

  <main class="container">
    <section class="card controls">
      <div class="top-row">
        <div class="tabs" role="tablist" aria-label="Puzzle selector">
          <button id="tab1" class="tab active" type="button" role="tab" aria-selected="true">Puzzle 1</button>
          <button id="tab2" class="tab" type="button" role="tab" aria-selected="false">Puzzle 2</button>
        </div>

        <div class="difficulty">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button id="newPuzzleBtn" class="btn btn-primary" type="button">New puzzle</button>
        <button id="checkBtn" class="btn" type="button">Check</button>
        <button id="solveBtn" class="btn btn-ghost" type="button">Show solution</button>
        <button id="clearBtn" class="btn btn-ghost" type="button">Clear entries</button>
      </div>

      <div class="toggles">
        <label class="toggle">
          <input id="autoCheck" type="checkbox" checked />
          <span>Auto-check conflicts</span>
        </label>
        <label class="toggle">
          <input id="pencilMode" type="checkbox" />
          <span>Pencil mode</span>
        </label>
      </div>
    </section>

    <section class="board-wrap">
      <div class="card board-card">
        <div class="board-head">
          <div class="puzzle-title">
            <span class="badge" id="puzzleBadge">Puzzle 1</span>
            <span class="muted" id="puzzleHint">Message unlocks when solved</span>
          </div>
          <div class="legend muted">
            Tip: click a cell, then use keyboard or number pad
          </div>
        </div>

        <div id="grid" class="grid" aria-label="Sudoku grid"></div>

        <div class="numpad-wrap" aria-label="Number pad">
          <div class="numpad">
            <button class="pad" data-pad="1" type="button">1</button>
            <button class="pad" data-pad="2" type="button">2</button>
            <button class="pad" data-pad="3" type="button">3</button>
            <button class="pad" data-pad="4" type="button">4</button>
            <button class="pad" data-pad="5" type="button">5</button>
            <button class="pad" data-pad="6" type="button">6</button>
            <button class="pad" data-pad="7" type="button">7</button>
            <button class="pad" data-pad="8" type="button">8</button>
            <button class="pad" data-pad="9" type="button">9</button>

            <button class="pad pad-wide" data-pad="clear" type="button">Clear</button>
            <button class="pad pad-wide" data-pad="pencil" type="button">Pencil</button>
          </div>
          <p class="muted tiny">Number pad is optimised for phones (still works on desktop).</p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle">You did it!</h2>
      <p id="modalMsg" class="modal-msg"></p>
      <div class="modal-actions">
        <button id="yesBtn" class="btn btn-primary btn-yes hidden" type="button">Yes 💍</button>
        <button id="modalClose" class="btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <footer class="container footer">
    <small class="muted">Keyboard: 1–9 to enter • Backspace/Delete to clear • Arrows to move</small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
